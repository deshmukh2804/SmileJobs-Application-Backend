name: SmileJobs Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main.yml"

  workflow_dispatch:

concurrency:
  group: smilejobs-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI - Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate server.js
        run: node --check server.js

      - name: CI completed
        run: echo "Backend CI validation completed successfully."

  deploy:
    name: CD - Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure SSH key
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/smilejobs_deploy_key

          chmod 600 ~/.ssh/smilejobs_deploy_key

          ssh-keygen -y -f ~/.ssh/smilejobs_deploy_key > /tmp/deploy_public_key

          echo "SSH private key successfully decoded and validated."

      - name: Add DigitalOcean host to known_hosts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          set -e

          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -e

          echo "=========================================="
          echo "Starting SmileJobs backend deployment"
          echo "=========================================="

          ssh \
            -i ~/.ssh/smilejobs_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DO_USER@$DO_HOST" << 'REMOTE_SCRIPT'

          set -e

          echo "Connected to DigitalOcean successfully."

          echo "=========================================="
          echo "Updating SmileJobs backend"
          echo "=========================================="

          cd /var/www/smilejobs-backend

          echo "Fetching latest code..."
          git fetch origin main

          echo "Updating production code..."
          git reset --hard origin/main

          echo "Entering backend directory..."
          cd backend

          echo "Installing backend dependencies..."
          npm ci --legacy-peer-deps

          echo "Validating server.js..."
          node --check server.js

          echo "Restarting SmileJobs backend..."

          if pm2 describe smilejobs-backend > /dev/null 2>&1; then
            pm2 restart smilejobs-backend --update-env
          else
            echo "PM2 application not found. Starting application..."
            pm2 start server.js --name smilejobs-backend
          fi

          echo "Waiting for backend..."
          sleep 5

          echo "PM2 status:"
          pm2 status

          echo "Checking backend health..."

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:5001/api/health

          echo ""

          echo "=========================================="
          echo "SmileJobs backend deployment successful"
          echo "=========================================="

          REMOTE_SCRIPT

      - name: Deployment completed
        run: echo "Production deployment completed successfully."
